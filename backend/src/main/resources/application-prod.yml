spring:
  jpa:
    hibernate:
      ddl-auto: validate
  mail:
    host: ${SMTP_HOST}
    port: ${SMTP_PORT:587}
    username: ${SMTP_USER}
    password: ${SMTP_PASSWORD}
    properties:
      mail:
        smtp:
          auth: true
          starttls:
            enable: true
            required: true

springdoc:
  api-docs:
    enabled: false
  swagger-ui:
    enabled: false

fitflow:
  messaging:
    mode: rabbit
  datasource:
    mysql:
      url: ${MYSQL_URL}
      jdbc-url: ${MYSQL_URL}
      username: ${MYSQL_USER}
      password: ${MYSQL_PASSWORD}
    postgres:
      url: ${PG_URL}
      jdbc-url: ${PG_URL}
      username: ${PG_USER}
      password: ${PG_PASSWORD}
  security:
    jwt:
      secret: ${JWT_SECRET}
    master-key: ${APP_MASTER_KEY}

logging:
  config: classpath:logback-spring.xml
