<!DOCTYPE html>
<html>
<head><meta charset="UTF-8"><title>Session Cancelled</title></head>
<body>
    <p>Hello <span th:text="${firstName}">Member</span>,</p>
    <p>We regret to inform you that your upcoming session for <strong th:text="${className}">Class</strong> scheduled at <span th:text="${sessionStartTime}">Time</span> has been cancelled.</p>
    <p th:if="${reason != null}">Reason: <span th:text="${reason}">Reason</span></p>
    <p>Any booking entitlement or credit has been returned to your account.</p>
    <p>Best regards,<br>The FitFlow Team</p>
</body>
</html>
