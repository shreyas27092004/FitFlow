<!DOCTYPE html>
<html>
<head><meta charset="UTF-8"><title>Session Rescheduled</title></head>
<body>
    <p>Hello <span th:text="${firstName}">Member</span>,</p>
    <p>Your session for <strong th:text="${className}">Class</strong> with <span th:text="${trainerName}">Trainer</span> has been rescheduled.</p>
    <p>Previous Time: <span th:text="${oldStartTime}">Old Time</span></p>
    <p>New Time: <span th:text="${newStartTime}">New Time</span></p>
    <p>Best regards,<br>The FitFlow Team</p>
</body>
</html>
