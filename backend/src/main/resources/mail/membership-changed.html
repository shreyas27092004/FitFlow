<!DOCTYPE html>
<html>
<head><meta charset="UTF-8"><title>Membership Changed</title></head>
<body>
    <p>Hello <span th:text="${firstName}">Member</span>,</p>
    <p>Your membership has been updated from <span th:text="${oldPlanName}">BASIC</span> to <strong th:text="${newPlanName}">PRO</strong>.</p>
    <p>Proration Credit: <span th:text="${creditFormatted}">Rs 0.00</span></p>
    <p>Amount Due: <span th:text="${amountDueFormatted}">Rs 0.00</span></p>
    <p>Refund Issued: <span th:text="${refundFormatted}">Rs 0.00</span></p>
    <p th:if="${endsAt != null}">New period ends at: <span th:text="${endsAt}">Date</span></p>
    <p>Best regards,<br>The FitFlow Team</p>
</body>
</html>
