<!DOCTYPE html>
<html>
<head><meta charset="UTF-8"><title>Refund Processed</title></head>
<body>
    <p>Hello <span th:text="${firstName}">Member</span>,</p>
    <p>Your refund has been successfully processed.</p>
    <p>Refund Amount: <strong th:text="${amountFormatted}">Rs 499.00</strong></p>
    <p th:if="${reason != null}">Reason: <span th:text="${reason}">Plan change</span></p>
    <p>It may take 5-7 business days to reflect in your account.</p>
    <p>Best regards,<br>The FitFlow Team</p>
</body>
</html>
