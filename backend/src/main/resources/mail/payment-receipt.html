<!DOCTYPE html>
<html>
<head><meta charset="UTF-8"><title>Payment Receipt</title></head>
<body>
    <p>Hello <span th:text="${firstName}">Member</span>,</p>
    <p>Thank you for your payment!</p>
    <p>Invoice Number: <strong th:text="${invoiceNumber}">INV-12345</strong></p>
    <p>Total Paid: <strong th:text="${amountFormatted}">Rs 499.00</strong></p>
    <p th:if="${description != null}">Description: <span th:text="${description}">Details</span></p>
    <p>Best regards,<br>The FitFlow Team</p>
</body>
</html>
