# Wellness suggestions, not medical advice. Rules are illustrative and must be reviewed by a qualified professional before real use.

injuries:
  KNEE:
    MILD:
      avoid: [high_impact]
    MODERATE:
      avoid: [high_impact, deep_flexion]
    SEVERE:
      avoid: [high_impact, deep_flexion, heavy_lifting]
      cap: LOW
  ANKLE:
    MILD:
      avoid: []
    MODERATE:
      avoid: [high_impact, balance_risk]
    SEVERE:
      avoid: [high_impact, balance_risk]
      cap: LOW
  HIP:
    MILD:
      avoid: [deep_flexion]
    MODERATE:
      avoid: [deep_flexion, high_impact]
    SEVERE:
      avoid: [deep_flexion, high_impact, heavy_lifting]
      cap: LOW
  LOWER_BACK:
    MILD:
      avoid: [heavy_lifting]
    MODERATE:
      avoid: [heavy_lifting, deep_flexion]
    SEVERE:
      avoid: [heavy_lifting, deep_flexion, high_impact, inversion]
      cap: LOW
  UPPER_BACK:
    MILD:
      avoid: [inversion]
    MODERATE:
      avoid: [inversion, heavy_lifting]
    SEVERE:
      avoid: [inversion, heavy_lifting, high_impact]
      cap: LOW
  NECK:
    MILD:
      avoid: [inversion]
    MODERATE:
      avoid: [inversion, heavy_lifting]
    SEVERE:
      avoid: [inversion, heavy_lifting, high_impact]
      cap: LOW
  SHOULDER:
    MILD:
      avoid: [inversion]
    MODERATE:
      avoid: [inversion, heavy_lifting]
    SEVERE:
      avoid: [inversion, heavy_lifting]
      cap: LOW
  ELBOW:
    MILD:
      avoid: []
    MODERATE:
      avoid: [heavy_lifting]
    SEVERE:
      avoid: [heavy_lifting, inversion]
      cap: LOW
  WRIST:
    MILD:
      avoid: []
    MODERATE:
      avoid: [inversion, heavy_lifting]
    SEVERE:
      avoid: [inversion, heavy_lifting]
      cap: LOW

conditions:
  HYPERTENSION:
    avoid: [heated_room, inversion, heavy_lifting]
    cap: MODERATE
  ASTHMA:
    avoid: [heated_room, high_cardio]
  DIABETES:
    avoid: []
  OSTEOPOROSIS:
    avoid: [high_impact, deep_flexion, balance_risk]
  JOINT_ARTHRITIS:
    avoid: [high_impact, deep_flexion]
  PREGNANCY:
    avoid: [heated_room, inversion, high_impact, balance_risk, heavy_lifting]
    cap: MODERATE
  HEART_CONDITION:
    avoid: [heated_room, inversion, heavy_lifting, high_cardio]
    cap: LOW
  OTHER_CONSULT_DOCTOR:
    avoid: []
    cap: MODERATE
