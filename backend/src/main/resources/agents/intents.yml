# FitFlow Deterministic Intent Classifier Patterns
# Mapped strictly to member specialist agents

intents:
  BOOKING:
    keywords:
      - book
      - booking
      - reserve
      - reservation
      - cancel booking
      - cancellation
      - my bookings
      - upcoming sessions
      - scheduled sessions
      - sessions
      - schedule class
      - booked
      - seat
    patterns:
      - "(?i).*\\b(book|reserve|schedule)\\s+(a|an|the|my)?\\s*(class|session|spot|seat).*"
      - "(?i).*\\b(cancel|drop)\\s+(my)?\\s*(booking|reservation|class|session).*"
      - "(?i).*\\b(show|view|check|what are)\\s+(my)?\\s*(scheduled\\s+)?(bookings|sessions?).*"
      - "(?i).*\\bsearch\\s+sessions?.*"

  MEMBERSHIP:
    keywords:
      - membership
      - plan
      - plans
      - upgrade
      - downgrade
      - subscription
      - subscribe
      - cancel membership
      - proration
      - prorated
      - refund
      - refund preview
      - change plan
      - pricing
      - tier
    patterns:
      - "(?i).*\\b(upgrade|downgrade|change|switch)\\s+(my)?\\s*(plan|membership|tier|subscription).*"
      - "(?i).*\\b(cancel|end)\\s+(my)?\\s*(membership|subscription).*"
      - "(?i).*\\b(how much|cost|price|prorated|refund)\\b.*"
      - "(?i).*\\b(list|show|available)\\s+plans?.*"

  INTAKE:
    keywords:
      - intake
      - questionnaire
      - health profile
      - fitness profile
      - par-q
      - parq
      - onboard
      - onboarding
      - medical clearance
      - update health
      - physical readiness
      - injury
      - injuries
    patterns:
      - "(?i).*\\b(start|fill|do|complete|update)\\s+.*(intake|health profile|fitness profile|questionnaire).*"
      - "(?i).*\\bpar-?q.*"
      - "(?i).*\\b(record|report)\\s+.*(injur(y|ies)|condition|health|readiness|profile).*"

  SAFE_CLASS_MATCHER:
    keywords:
      - safe
      - safe classes
      - suitable
      - recommend
      - joint friendly
      - knee friendly
      - back friendly
      - safe for me
      - match classes
      - can i do
      - avoid
    patterns:
      - "(?i).*\\b(what|which)\\s+(classes|sessions?|workouts?)\\s+are\\s+(safe|suitable|recommended).*"
      - "(?i).*\\b(safe|suitable)\\s+(classes|sessions?|workouts?)\\s+for\\s+.*"
      - "(?i).*\\b(safe|suitable)\\s+for\\s+(my)?\\s*(knee|back|ankle|shoulder|hip|injury|condition).*"
      - "(?i).*\\b(recommend|find)\\s+(safe|suitable)\\s+(classes|sessions?|workouts?).*"
      - "(?i).*\\bcan\\s+i\\s+(attend|do|take)\\s+.*(safe|injury).*"
      - "(?i).*\\bmatch\\s+(safe)?\\s*classes.*"
