# FitFlow Deterministic Intent Classifier Patterns
# Mapped strictly to member, trainer, and admin specialist agents

intents:
  # ============================================================================
  # Member Agents
  # ============================================================================
  BOOKING:
    keywords:
      - book
      - booking
      - reserve
      - reservation
      - cancel booking
      - cancellation
      - my bookings
      - upcoming sessions
      - scheduled sessions
      - schedule class
      - booked
      - reserve spot
      - reserve seat
      - book class
      - book session
    patterns:
      - "(?i)\\b(book|reserve|schedule)\\s+(a|an|the|my)?\\s*(class|session|spot|seat)\\b"
      - "(?i)\\b(cancel|drop)\\s+(my)?\\s*(booking|reservation|class|session)\\b"
      - "(?i)\\b(show|view|check|what are|list)\\s+(my)?\\s*(scheduled\\s+)?(bookings|booked classes)\\b"
      - "(?i)\\bsearch\\s+(classes|sessions?)\\b"
      - "(?i)\\bupcoming\\s+(bookings|sessions)\\b"

  MEMBERSHIP:
    keywords:
      - membership
      - membership plan
      - membership plans
      - upgrade
      - downgrade
      - subscription
      - subscribe
      - cancel membership
      - proration
      - prorated
      - refund
      - refund preview
      - change plan
      - switch plan
      - pricing
      - membership tier
    patterns:
      - "(?i)\\b(upgrade|downgrade|change|switch)\\s+(my\\s+)?(plan|membership|tier|subscription)\\b"
      - "(?i)\\b(cancel|end)\\s+(my\\s+)?(membership|subscription)\\b"
      - "(?i)\\b(how much|cost|price|pricing|prorated|refund)\\b"
      - "(?i)\\b(list|show|available)\\s+(membership|subscription)?\\s*plans?\\b"
      - "(?i)\\bmembership\\s+(status|details?|tier)\\b"

  INTAKE:
    keywords:
      - intake
      - questionnaire
      - health profile
      - fitness profile
      - par-q
      - parq
      - onboard
      - onboarding
      - medical clearance
      - update health
      - physical readiness
      - injury
      - injuries
    patterns:
      - "(?i)\\b(start|fill|complete|update)\\b.*\\b(intake|health profile|fitness profile|questionnaire)\\b"
      - "(?i)\\bpar-?q\\b"
      - "(?i)\\b(record|report)\\b.*\\b(injur(y|ies)|condition|health|readiness|profile)\\b"

  SAFE_CLASS_MATCHER:
    keywords:
      - safe
      - safe classes
      - suitable
      - recommend
      - joint friendly
      - knee friendly
      - back friendly
      - safe for me
      - match classes
      - can i do
      - avoid
    patterns:
      - "(?i)\\b(what|which)\\s+(classes|sessions?|workouts?)\\s+are\\s+(safe|suitable|recommended)\\b"
      - "(?i)\\b(safe|suitable)\\s+(classes|sessions?|workouts?)\\s+for\\b"
      - "(?i)\\b(safe|suitable)\\s+for\\s+(my)?\\s*(knee|back|ankle|shoulder|hip|injury|condition)\\b"
      - "(?i)\\b(recommend|find)\\s+(safe|suitable)\\s+(classes|sessions?|workouts?)\\b"
      - "(?i)\\bcan\\s+i\\s+(attend|do|take)\\b.*\\b(safe|injury)\\b"
      - "(?i)\\bmatch\\s+(safe)?\\s*classes\\b"

  PLAN_BUILDER:
    keywords:
      - weekly plan
      - build plan
      - plan builder
      - workout schedule
      - routine
      - plan my week
      - schedule my week
      - suggest schedule
      - create plan
      - plan workouts
      - workout plan
      - propose weekly plan
      - propose plan
    patterns:
      - "(?i)\\b(build|make|create|generate|suggest|propose)\\b.*\\b(plan|schedule|routine)\\b"
      - "(?i)\\b(weekly|workout)\\s+(plan|schedule|routine)\\b"
      - "(?i)\\bplan\\s+(my\\s+)?(week|workouts?)\\b"

  WELLNESS_COACH:
    keywords:
      - coach
      - wellness coach
      - progress
      - weekly progress
      - streak
      - missed session
      - missed sessions
      - catch up
      - catchup
      - how am i doing
      - workout summary
    patterns:
      - "(?i)\\b(weekly\\s+)?progress\\b"
      - "(?i)\\b(missed|catch\\s*up)\\s+(sessions?|classes?)\\b"
      - "(?i)\\bhow\\s+am\\s+i\\s+doing\\b"
      - "(?i)\\b(my\\s+)?streak\\b"

  NUTRITION_NUMBERS:
    keywords:
      - calories
      - calorie
      - burn
      - calorie burn
      - energy expenditure
      - bmr
      - tdee
      - class burn
    patterns:
      - "(?i)\\b(how\\s+many\\s+)?calories\\b"
      - "(?i)\\b(calorie|energy)\\s+(burn|expenditure|numbers|estimate)\\b"
      - "(?i)\\bclass\\s+burn\\b"

  # ============================================================================
  # Trainer Agents
  # ============================================================================
  TRAINER_PREP:
    keywords:
      - prep
      - prep summary
      - session prep
      - class prep
      - attendee injuries
      - modifications
      - class summary
      - prep report
    patterns:
      - "(?i)\\b(class|session)\\s+prep\\b"
      - "(?i)\\bprep\\s+summary\\b"
      - "(?i)\\b(modifications?|modifications\\s+needed)\\b"

  TRAINER_SCHEDULE:
    keywords:
      - my schedule
      - my classes
      - trainer sessions
      - my sessions
      - upcoming sessions
      - scheduled sessions
      - my earnings
      - earnings
      - my pay
      - payout
      - how much did i make
      - pay summary
    patterns:
      - "(?i)\\b(my|upcoming)\\b.*\\bsessions?\\b"
      - "(?i)\\b(my\\s+)?(earnings|pay|payout|income)\\b"
      - "(?i)\\b(how\\s+much\\s+did\\s+i\\s+make|trainer\\s+schedule)\\b"

  # ============================================================================
  # Admin Agents
  # ============================================================================
  RETENTION:
    keywords:
      - retention
      - at risk
      - at-risk
      - churn
      - inactive members
      - retention offer
      - nudge
      - grant free session
    patterns:
      - "(?i)\\b(at[\\s-]risk|churn|inactive)\\s+members?\\b"
      - "(?i)\\b(retention|nudge|retention\\s+offer)\\b"
      - "(?i)\\bgrant\\s+free\\s+session\\b"

  CLASS_METADATA_ASSISTANT:
    keywords:
      - metadata
      - draft class
      - create class
      - creating class
      - propose creating
      - class metadata
      - met value
      - draft metadata
      - new class
    patterns:
      - "(?i)\\b(draft|create|creating|new|propose)\\b.*\\bclass\\b"
      - "(?i)\\b(class\\s+)?metadata\\b"

  DEMAND_FORECAST:
    keywords:
      - demand
      - forecast
      - demand insights
      - fill rate
      - waitlist analysis
      - add session
      - adding a session
      - propose session
      - propose adding
      - reduce session
      - popular times
      - utilization
    patterns:
      - "(?i)\\b(demand|insights|fill\\s*rate|popularity|utilization)\\b"
      - "(?i)\\b(propose\\s+)?(add|adding|reduce|reducing|suggest)\\s+(a\\s+)?sessions?\\b"
