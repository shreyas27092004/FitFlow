<!DOCTYPE html>
<html>
<head><meta charset="UTF-8"><title>Refund Needs Approval</title></head>
<body>
    <p>Hello <span th:text="${firstName}">Admin</span>,</p>
    <p>A refund requires your administrative approval.</p>
    <p>Refund ID: <strong th:text="${refundId}">123</strong></p>
    <p>Amount: <strong th:text="${amountFormatted}">Rs 1500.00</strong></p>
    <p th:if="${reason != null}">Reason: <span th:text="${reason}">Reason</span></p>
    <p>Please log in to the admin console to review and decide.</p>
    <p>Best regards,<br>The FitFlow System</p>
</body>
</html>
